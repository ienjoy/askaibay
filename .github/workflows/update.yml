name: 每日抓取更新租房地图

on:
  schedule:
    # UTC 14:30 = 加州时间早上 6:30（夏令时）/ 7:30（冬令时）
    - cron: "30 14 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取脚本
        run: python scraper/scrape.py

      - name: 提交更新
        run: |
          git config user.name "rental-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json state/seen.json state/last_run.json
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "自动更新房源数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 放在提交之后：就算某个论坛抓挂了，当天抓到的好数据也已经存下来了
      - name: 检查数据源健康状况
        run: |
          down=$(python -c "import json;print(','.join(json.load(open('state/last_run.json'))['down']))")
          if [ -n "$down" ]; then
            echo "::error::以下论坛这次一条都没抓到：$down（房源已保护不淘汰，但需要检查是被挡 IP 还是论坛改版）"
            exit 1
          fi
          echo "所有数据源正常"

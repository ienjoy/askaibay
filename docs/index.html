<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湾区租房地图</title>
<!-- Google Analytics 4（媒体资源 askaibay）。换 ID 改下面一行即可；ID 不合法或在 localhost 打开时自动不上报 -->
<script>
  window.GA_ID = 'G-N9KT8B9DRX';
  // 房东投稿的 Google 表单地址；留空则页面上不显示投稿入口
  window.SUBMIT_URL = '';
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  // 没填 ID、或者在本地 localhost 打开时，不加载也不上报
  window.TRACK_ON = /^G-[A-Z0-9]{6,}$/.test(GA_ID) && location.hostname !== 'localhost';
  if (TRACK_ON){
    const g = document.createElement('script');
    g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(g);
    gtag('js', new Date());
    gtag('config', GA_ID);
  }
  // 统一的埋点入口：没开统计时静默丢弃
  function track(name, params){ if (window.TRACK_ON) gtag('event', name, params || {}); }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  /* iOS Safari 的地址栏会伸缩，用 dvh 才能真正占满可见区域 */
  @supports (height: 100dvh){ html,body{height:100dvh} }
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);padding:12px 14px;font-size:13px;max-width:240px}
  .panel h1{font-size:15px;margin:0 0 6px}
  .panel .note{color:#777;font-size:11px;margin-top:8px;line-height:1.5}
  .row{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer;user-select:none}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.35);flex:0 0 auto}
  .cnt{color:#999;margin-left:auto}
  .popup-title{font-weight:600;margin-bottom:4px;line-height:1.4}
  .popup-meta{color:#555;font-size:12px;line-height:1.6}
  .popup-meta a{color:#1a6fd4}
  label.src{margin-right:10px;white-space:nowrap}
  #poll{margin-top:8px;border-top:1px solid #eee;padding-top:8px;color:#888;font-size:11px}
  #poll .opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  #poll button{font:inherit;font-size:11px;color:#555;background:#f4f5f7;border:1px solid #e2e4e8;
    border-radius:11px;padding:3px 9px;cursor:pointer}
  #poll button:hover{background:#e8eaee;color:#222}
  #poll.done{color:#aaa}
  #submit-box{margin-top:8px;border-top:1px solid #eee;padding-top:9px}
  #submit-link{display:block;text-align:center;background:#1a6fd4;color:#fff;
    text-decoration:none;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}
  #submit-link:hover{background:#155cb0}
  #submit-box .hint{color:#999;font-size:11px;margin-top:5px;line-height:1.5;text-align:center}
  .popup-owner{display:inline-block;background:#eaf2fd;color:#1a5fb4;border:1px solid #c7ddf7;
    border-radius:4px;padding:1px 6px;font-size:11px;margin-bottom:5px}
  .popup-contact{font-weight:600;color:#222}
  .leaflet-popup-content{margin:10px 14px;max-width:240px}

  /* 抽屉的关闭按钮，只在窄屏出现 */
  #close{display:none;position:absolute;top:10px;right:12px;
    width:34px;height:34px;border:0;background:transparent;
    font-size:26px;line-height:1;color:#999;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* 唤出筛选的悬浮按钮，只在窄屏出现 */
  #fab{display:none;position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));z-index:1200;
    background:#fff;border:1px solid #dcdfe4;border-radius:22px;
    box-shadow:0 3px 14px rgba(0,0,0,.28);padding:10px 18px;
    font:inherit;font-size:14px;color:#222;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #fab b{color:#1a6fd4}

  /* ---- 窄屏（手机）---- */
  @media (max-width: 700px){
    #fab{display:block}
    .panel{
      top:auto;left:0;right:0;bottom:0;max-width:none;
      border-radius:16px 16px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 18px rgba(0,0,0,.3);font-size:15px;
      max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
      transform:translateY(102%);transition:transform .22s ease;
    }
    .panel.open{transform:translateY(0)}
    .panel h1{font-size:17px;margin-bottom:10px;padding-right:34px}
    #close{display:block}
    /* 手指点得到：加大行高和勾选框 */
    .row{margin:0;padding:9px 0;gap:9px}
    .row input[type=checkbox]{width:19px;height:19px}
    .dot{width:15px;height:15px}
    label.src{display:inline-flex;align-items:center;gap:6px;margin:6px 14px 6px 0}
    label.src input{width:19px;height:19px}
    #days{font-size:15px;padding:5px 8px}
    #poll button{font-size:13px;padding:7px 13px}
    #submit-link{font-size:15px;padding:11px}
    #poll .opts{gap:7px}
    .panel .note{font-size:12px}
    .cnt{font-size:14px;color:#8a8f98}
    /* 弹窗在小屏上给足宽度，"查看原帖"要好点 */
    .leaflet-popup-content{margin:12px 14px;max-width:min(74vw,300px);font-size:14px}
    .popup-meta{font-size:13px}
    .popup-meta a{display:inline-block;padding:6px 0;font-size:14px}
    .leaflet-control-zoom{display:none}   /* 手机双指缩放即可，省地方 */
  }

</style>
</head>
<body>
<div id="map"></div>
<button id="fab">筛选 · <b id="fab-count">…</b> 条房源</button>
<div class="panel" id="panel">
  <button id="close" aria-label="关闭">&times;</button>
  <h1>湾区租房地图</h1>
  <div id="bands"></div>
  <div style="margin-top:8px;border-top:1px solid #eee;padding-top:8px">
    <label class="src"><input type="checkbox" id="src-bay123" checked> bay123</label>
    <label class="src"><input type="checkbox" id="src-cis" checked> chineseinsfbay</label>
    <label class="src" id="src-owner-wrap" style="display:none">
      <input type="checkbox" id="src-owner" checked> 房东直发</label>
  </div>
  <div style="margin-top:8px;border-top:1px solid #eee;padding-top:8px">
    发帖时间
    <select id="days" style="font-size:12px;margin-left:4px">
      <option value="0">全部</option>
      <option value="7">最近 7 天</option>
      <option value="14">最近 14 天</option>
      <option value="30">最近 30 天</option>
    </select>
  </div>
  <div id="poll">
    你是？<span style="color:#bbb">（点一下就好，帮我知道谁在用）</span>
    <div class="opts">
      <button data-role="找房">找房</button>
      <button data-role="出租">出租</button>
      <button data-role="中介">中介</button>
      <button data-role="随便看看">随便看看</button>
    </div>
  </div>
  <div id="submit-box" style="display:none">
    <a id="submit-link" href="#" target="_blank" rel="noopener">我有房子出租 →</a>
    <div class="hint">免费发布，审核后显示在地图上</div>
  </div>
  <div class="note">共 <b id="total"></b> 条房源。位置按帖子中的邮编/城市定位（近似位置，同区房源已散开），点击圆点看详情和原帖链接。<br>数据更新于：<b id="updated">加载中…</b></div>
</div>
<script>
const map = L.map('map').setView([37.55, -122.1], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const BANDS = [
  {key:'b1', label:'$1000 以下',   color:'#2e9e4f', test:v=>v!==null&&v!==undefined&&v<1000},
  {key:'b2', label:'$1000–1500', color:'#2b7de0', test:v=>v>=1000&&v<1500},
  {key:'b3', label:'$1500–2500', color:'#f29c11', test:v=>v>=1500&&v<2500},
  {key:'b4', label:'$2500 以上',  color:'#d93636', test:v=>v>=2500},
  {key:'b0', label:'未标价',       color:'#8a8f98', test:v=>v===null||v===undefined},
];
function bandOf(v){ return BANDS.find(b=>b.test(v)) || BANDS[4]; }

const state = {bands:new Set(BANDS.map(b=>b.key)), srcs:new Set(['bay123','cis','owner']), days:0};
const DOT_R = window.matchMedia('(max-width: 700px)').matches ? 8 : 6;
let markers = [];
let ownerSeen = false;

// 发帖日期是 ISO 字符串（YYYY-MM-DD），直接按字符串比大小即可
function cutoffISO(days){
  const t = new Date(Date.now() - days*86400000);
  return t.toISOString().slice(0,10);
}
function fresh(m){
  if (!state.days) return true;
  return m._date && m._date >= cutoffISO(state.days);
}

function refresh(){
  let shown = 0;
  for (const m of markers){
    const on = state.bands.has(m._band) && state.srcs.has(m._src) && fresh(m);
    if (on && !map.hasLayer(m)) m.addTo(map);
    if (!on && map.hasLayer(m)) map.removeLayer(m);
    if (on) shown++;
  }
  document.getElementById('total').textContent = shown;
  document.getElementById('fab-count').textContent = shown;
  for (const b of BANDS){
    const n = markers.filter(m=>m._band===b.key && state.srcs.has(m._src) && fresh(m)).length;
    const el = document.getElementById('cnt-'+b.key);
    if (el) el.textContent = n;
  }
}

const bandsDiv = document.getElementById('bands');
for (const b of BANDS){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<input type="checkbox" checked id="cb-'+b.key+'">'+
    '<span class="dot" style="background:'+b.color+'"></span>'+b.label+
    '<span class="cnt" id="cnt-'+b.key+'"></span>';
  row.querySelector('input').addEventListener('change', e=>{
    e.target.checked ? state.bands.add(b.key) : state.bands.delete(b.key); refresh();
    track('filter_price', {band: b.label, checked: e.target.checked});
  });
  bandsDiv.appendChild(row);
}
for (const s of ['bay123','cis','owner']){
  document.getElementById('src-'+s).addEventListener('change', e=>{
    e.target.checked ? state.srcs.add(s) : state.srcs.delete(s); refresh();
    track('filter_source', {source: s, checked: e.target.checked});
  });
}
document.getElementById('days').addEventListener('change', e=>{
  state.days = parseInt(e.target.value, 10) || 0; refresh();
  track('filter_days', {days: state.days || 'all'});
});

// 点"查看原帖"是最强的意图信号：说明这个人真的在联系房东
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('a.orig');
  if (a) track('click_original', {
    city: a.dataset.city || '未知',
    price: parseInt(a.dataset.price, 10) || 0,
    source: a.dataset.source || ''
  });
});

// 身份小调查：答过一次就不再出现（存在本机浏览器里，不会上传任何个人信息）
(function(){
  const box = document.getElementById('poll');
  let answered = null;
  try { answered = localStorage.getItem('role'); } catch(e) {}
  if (answered){ box.remove(); return; }
  box.querySelector('.opts').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    const role = btn.dataset.role;
    try { localStorage.setItem('role', role); } catch(e) {}
    track('survey_role', {role: role});
    if (window.TRACK_ON) gtag('set', 'user_properties', {visitor_role: role});
    box.className = 'done';
    box.textContent = '谢谢！';
    setTimeout(()=>box.remove(), 1600);
  });
})();

// 投稿入口：只有配置了表单地址才显示
(function(){
  if (!window.SUBMIT_URL) return;
  const box = document.getElementById('submit-box');
  const a = document.getElementById('submit-link');
  a.href = SUBMIT_URL;
  box.style.display = 'block';
  a.addEventListener('click', () => track('click_submit'));
})();

// 手机上把筛选面板收成底部抽屉：点悬浮按钮拉起，点关闭/点地图收回
(function(){
  const panel = document.getElementById('panel');
  const fab = document.getElementById('fab');
  const isPhone = () => window.matchMedia('(max-width: 700px)').matches;

  function open(){ panel.classList.add('open'); fab.style.display = 'none'; }
  function close(){ panel.classList.remove('open'); if (isPhone()) fab.style.display = 'block'; }

  fab.addEventListener('click', open);
  document.getElementById('close').addEventListener('click', close);
  // 点地图任意处收起抽屉，手指不用去够那个小叉
  map.on('click', close);
  map.on('movestart', close);
  // 转屏或从手机切到桌面尺寸时，恢复成该尺寸的正常状态
  window.addEventListener('resize', () => {
    if (!isPhone()){ panel.classList.remove('open'); fab.style.display = 'none'; }
    else if (!panel.classList.contains('open')) fab.style.display = 'block';
  });
})();

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('updated').textContent = data.updated || '未知';
    for (const p of data.points) {
      const b = bandOf(p.pv);
      const owner = p.s === 'owner';
      const m = L.circleMarker([p.lat, p.lng], {
        // 手机上圆点大一点，手指才点得准；房东直发的用深蓝粗描边区分
        radius: owner ? DOT_R + 1 : DOT_R,
        color: owner ? '#1a5fb4' : 'rgba(0,0,0,.45)',
        weight: owner ? 2.5 : 1,
        fillColor: b.color, fillOpacity:.85
      });
      if (owner) ownerSeen = true;
      const srcLabel = p.s === 'cis' ? 'chineseinsfbay' : (owner ? '房东直发' : p.s);
      const esc = v => String(v == null ? '' : v).replace(/[<>&"]/g,
        c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
      let html = (owner ? '<div class="popup-owner">房东直发</div>' : '') +
        '<div class="popup-title">'+esc(p.t)+'</div>'+
        '<div class="popup-meta">'+
        '租金：'+esc(p.p || '未标价')+(p.k ? ' · '+esc(p.k) : '')+'<br>'+
        '位置：'+esc(p.c||'')+(p.z? (p.c?' · ':'')+esc(p.z) : '')+
        (p.lv==='city'?'（城市级近似）':'（邮编级近似）')+'<br>';
      if (owner && p.n) html += esc(p.n)+'<br>';
      html += (owner ? '发布' : '发布')+'：'+esc(p.d||'')+' · 来源：'+esc(srcLabel)+'<br>';
      if (owner && p.ct) html += '联系：<span class="popup-contact">'+esc(p.ct)+'</span><br>';
      if (p.u) html += '<a href="'+esc(p.u)+'" target="_blank" rel="noopener" class="orig"'+
        ' data-city="'+esc(p.c||'')+'" data-price="'+(p.pv||0)+'" data-source="'+esc(p.s)+'">'+
        (owner ? '查看详情 →' : '查看原帖 →')+'</a>';
      html += '</div>';
      m.bindPopup(html);
      m._band = b.key; m._src = p.s; m._date = p.d || '';
      m.on('popupopen', () => track('open_listing', {
        city: p.c || '未知', zip: p.z || '', price_band: b.label,
        price: p.pv || 0, source: p.s
      }));
      markers.push(m);
    }
    if (ownerSeen) document.getElementById('src-owner-wrap').style.display = '';
    refresh();
  })
  .catch(e => { document.getElementById('updated').textContent = '数据加载失败'; });
</script>
</body>
</html>
